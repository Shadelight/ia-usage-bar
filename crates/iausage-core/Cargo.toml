[package]
name = "iausage-core"
version = "0.2.4"
description = "Shared provider pipeline for IA Usage Bar (GUI + CLI)"
authors = ["Alberth Salazar"]
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
walkdir = "2"
dirs = "5"
toml = "0.8"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
# M5 sync: Argon2id -> XChaCha20-Poly1305, sales/nonces aleatorios, fingerprint.
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
# M5 V1b: HTTP local sin runtime async, QR de pareo, IP LAN.
tiny_http = "0.12"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
local-ip-address = "0.6"
# M6 IDE: eventos locales con debounce, sin convertir cada cambio en polling HTTP.
notify = "8"
