<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA Usage Bar</title>
  </head>
  <body>
    <div id="panel" class="panel">
      <header class="head" data-tauri-drag-region>
        <div class="head-copy" data-tauri-drag-region>
          <div class="head-title" data-tauri-drag-region>IA Usage</div>
          <div id="updated" class="head-sub">—</div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" data-act="refresh" title="Actualizar" aria-label="Refresh">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-spend" data-act="spend" title="Gasto" aria-label="Spend">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2.5v11M10.4 5.2c0-1.1-1-1.7-2.4-1.7S5.6 4.2 5.6 5.2c0 .9.7 1.4 2.5 1.8 1.9.4 2.7 1.1 2.7 2.3 0 1.2-1.1 2-2.8 2s-2.8-.8-2.8-2.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" data-act="settings" title="Ajustes" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6.5 2.2 7 4.1l.9.3c.3-.1.6-.2.9-.2l.9-.3.5-1.9M9.5 13.8 9 11.9l-.9-.3c-.3.1-.6.2-.9.2l-.9.3-.5 1.9M2.2 6.5 4.1 7l.3.9c-.1.3-.2.6-.2.9l-.3.9-1.9.5M13.8 9.5 11.9 9l-.3-.9c.1-.3.2-.6.2-.9l.3-.9 1.9-.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
        </div>
      </header>

      <main id="view-dash" class="dash">
        <div id="empty" class="empty hidden">
          <p id="empty-text">Aún no has añadido ninguna IA.</p>
          <button class="btn" id="empty-detect" data-act="detect">Detectar las que ya uso</button>
          <button class="btn ghost" id="empty-add" data-act="settings">Añadir manualmente</button>
        </div>
        <div id="stall" class="stall hidden"></div>
        <nav id="tabs" class="tabs" aria-label="Proveedores"></nav>
        <section id="detail" class="detail"></section>
      </main>

      <main id="view-spend" class="spend hidden">
        <div class="settings-head">
          <button class="icon-btn" data-act="back" aria-label="Back">‹</button>
          <h2 id="spend-title">Gasto del mes</h2>
        </div>
        <div id="spend-body" class="spend-body"></div>
      </main>

      <main id="view-settings" class="settings hidden">
        <div class="settings-head">
          <button class="icon-btn" data-act="back" aria-label="Back">‹</button>
          <h2 id="settings-title">Ajustes</h2>
        </div>
        <div id="settings-body" class="settings-body"></div>
      </main>

      <footer class="foot">
        <span class="foot-name">IA Usage Bar</span>
        <div class="lang-seg">
          <button class="seg" data-act="lang-en">EN</button>
          <button class="seg" data-act="lang-es">ES</button>
        </div>
        <button class="foot-quit" data-act="quit" id="btn-quit">Salir</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
