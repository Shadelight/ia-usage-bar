<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA Usage</title>
  </head>
  <body>
    <div id="panel" class="panel">
      <header class="head" data-tauri-drag-region>
        <div class="head-brand" data-tauri-drag-region>
          <img class="head-brand-mark mark-dark" src="/src/assets/brand/ia-usage-small-mark.svg" alt="" aria-hidden="true" />
          <img class="head-brand-mark mark-light" src="/src/assets/brand/ia-usage-small-mark-light.svg" alt="" aria-hidden="true" />
          <div class="head-copy" data-tauri-drag-region>
            <div class="head-title" data-tauri-drag-region>IA Usage</div>
            <div id="updated" class="head-sub">—</div>
          </div>
        </div>
        <div class="head-actions">
          <button class="icon-btn" data-act="refresh" title="Actualizar" aria-label="Refresh">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v2.6h-2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-pin" data-act="toggle-pin" title="Siempre visible" aria-label="Pin">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 2h4l-.5 4.5L11 8v1H5V8l1.5-1.5L6 2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 9v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-menu" data-act="toggle-menu" title="Menú" aria-label="Menu">
            <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3.5" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="12.5" cy="8" r="1.4" fill="currentColor"/></svg>
          </button>
          <span class="window-separator" aria-hidden="true"></span>
          <button class="icon-btn window-control" data-act="minimize" title="Minimizar" aria-label="Minimizar">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 11.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn window-control close-control" data-act="close-window" title="Cerrar" aria-label="Cerrar">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="head-menu" class="head-menu hidden"></div>
      </header>

      <main id="view-dash" class="dash">
        <div id="empty" class="empty hidden">
          <p id="empty-text">Aún no has añadido ninguna IA.</p>
          <button class="btn" id="empty-detect" data-act="detect">Detectar las que ya uso</button>
          <button class="btn ghost" id="empty-add" data-act="manage-providers">Añadir manualmente</button>
        </div>
        <div id="stall" class="stall hidden"></div>
        <div class="tabs-shell">
          <div id="tabs-scroll" class="tabs-scroll">
            <div id="tabs" class="tabs" role="tablist" aria-label="Proveedores"></div>
          </div>
          <button id="add-provider" class="tab-add" data-act="manage-providers" title="Añadir" aria-label="Añadir">
            <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <span id="tabs-hint" class="tabs-hint hidden" role="status">Desliza para ver más</span>
        </div>
        <section id="detail" class="detail"></section>
      </main>

      <main id="view-spend" class="spend hidden">
        <div class="settings-head">
          <button class="icon-btn" data-act="back" aria-label="Back">‹</button>
          <h2 id="spend-title">Gasto del mes</h2>
        </div>
        <div id="spend-body" class="spend-body"></div>
      </main>

      <main id="view-settings" class="settings hidden">
        <div class="settings-head">
          <button class="icon-btn" data-act="back" aria-label="Back">‹</button>
          <h2 id="settings-title">Ajustes</h2>
        </div>
        <nav id="settings-cats" class="settings-cats"></nav>
        <div id="settings-body" class="settings-body"></div>
      </main>

      <footer class="foot">
        <span class="foot-name" id="app-version">IA Usage</span>
        <div class="lang-seg">
          <button class="seg" data-act="lang-en">EN</button>
          <button class="seg" data-act="lang-es">ES</button>
        </div>
        <button class="foot-quit" data-act="quit" id="btn-quit">Salir</button>
      </footer>
      <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
