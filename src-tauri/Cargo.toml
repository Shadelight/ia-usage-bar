[package]
name = "iausagebar"
version = "0.3.8"
description = "Monitor de uso de planes de IA para la bandeja de Windows"
authors = ["Alberth Salazar"]
edition = "2021"

[lib]
name = "iausagebar_lib"
# Keep rlib-only: adding cdylib/staticlib can hit the GNU linker error
# "export ordinal too large" because of Tauri's exported symbol surface.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
iausage-core = { path = "../crates/iausage-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
walkdir = "2"
dirs = "5"
toml = "0.8"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
