name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build bundled CLI
        run: cargo build --release --locked -p iausage

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }
          $scriptArgs = @("scripts/build-release-notes.mjs", "${{ github.ref_name }}")
          if ($prev) { $scriptArgs += @("--prev-tag", $prev.Trim()) }
          $body = & node @scriptArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $eof = "RELEASE_NOTES_EOF"
          "body<<$eof" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $eof | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows installers
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IA Usage Bar ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json

      - name: Checksum installers
        shell: pwsh
        run: |
          # El workspace Cargo vive en la raíz, así que los bundles quedan en
          # target/release/bundle (no en src-tauri/target).
          $files = @(Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi)
          if ($files.Count -eq 0) { throw "No installers found under target/release/bundle" }
          $files |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
