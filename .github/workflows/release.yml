name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  android:
    name: Build signed Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Test Android before signing
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:lintDebug
      - name: Validate Android signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing Android signing secrets. See android/README.md." >&2
            exit 1
          }
      - name: Assemble signed APK + AAB
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/iausage-release.jks"
          # versionName sigue el tag (v0.3.0 -> 0.3.0); versionCode usa el
          # run_number para garantizar que siempre crece aunque versionName se repita.
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle :app:assembleRelease :app:bundleRelease \
            -PIAUSAGE_STORE_FILE="$RUNNER_TEMP/iausage-release.jks" \
            -PIAUSAGE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PIAUSAGE_KEY_ALIAS="$KEY_ALIAS" \
            -PIAUSAGE_KEY_PASSWORD="$KEY_PASSWORD" \
            -PIAUSAGE_VERSION_NAME="$VERSION_NAME" \
            -PIAUSAGE_VERSION_CODE="$GITHUB_RUN_NUMBER"
          grep -q "\"versionName\": \"$VERSION_NAME\"" app/build/outputs/apk/release/output-metadata.json
      - name: Upload signed APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: ia-usage-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  vscode-extension:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and package VSIX
        working-directory: apps/vscode-extension
        run: |
          npm ci
          npm run package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-usage-vscode-extension
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error

  release:
    needs: [android, vscode-extension]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Validate Rust workspace
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Build bundled CLI
        run: cargo build --release --locked -p iausage

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }
          $scriptArgs = @("scripts/build-release-notes.mjs", "${{ github.ref_name }}")
          if ($prev) { $scriptArgs += @("--prev-tag", $prev.Trim()) }
          $body = & node @scriptArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $eof = "RELEASE_NOTES_EOF"
          "body<<$eof" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $eof | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows installers
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IA Usage ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json

      - name: Smoke installed CLI and user PATH
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS setup executable not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'iausage-cli-smoke'
          $process = Start-Process -FilePath $installer.FullName -Wait -PassThru -ArgumentList "/S /D=$installDir"
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          ./scripts/smoke-installed-cli.ps1 -InstallDir $installDir

      - name: Download Android APK + AAB
        uses: actions/download-artifact@v4
        with:
          name: ia-usage-android-release
          path: android-release

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: ia-usage-vscode-extension
          path: vscode-release

      - name: Rename Android and VSIX assets
        shell: pwsh
        run: |
          # actions/upload-artifact preserves the common ancestor of the
          # uploaded paths, so the APK/AAB land nested (apk/release/*.apk,
          # bundle/release/*.aab) rather than flat in android-release/.
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $apk = Get-ChildItem -Recurse android-release -Filter *.apk | Select-Object -First 1
          $aab = Get-ChildItem -Recurse android-release -Filter *.aab | Select-Object -First 1
          $vsix = Get-ChildItem -Recurse vscode-release -Filter *.vsix | Select-Object -First 1
          if (-not $apk -or -not $aab -or -not $vsix) { throw "Missing downloaded Android or VSIX asset (apk=$apk aab=$aab vsix=$vsix)" }
          Copy-Item $apk.FullName "android-release/IA-Usage-Android-$version.apk" -Force
          Copy-Item $aab.FullName "android-release/IA-Usage-Android-$version.aab" -Force
          Copy-Item $vsix.FullName "vscode-release/IA-Usage-VSCode-$version.vsix" -Force

      - name: Checksum all release assets
        shell: pwsh
        run: |
          # El workspace Cargo vive en la raíz, así que los bundles quedan en
          # target/release/bundle (no en src-tauri/target).
          # La release la crea una sola vez el job Windows vía tauri-action;
          # aquí solo se suben assets a esa misma release (nunca se crea otra).
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $files = @(Get-ChildItem -Recurse target/release/bundle -Include *.exe,*.msi)
          if ($files.Count -eq 0) { throw "No installers found under target/release/bundle" }
          $files += Get-Item "android-release/IA-Usage-Android-$version.apk", "android-release/IA-Usage-Android-$version.aab"
          $files += Get-Item "vscode-release/IA-Usage-VSCode-$version.vsix"
          # GitHub replaces spaces with dots in uploaded release asset names
          # (tauri-action's Windows installers are the only files here with
          # spaces), so record checksums under the name assets will actually
          # have once uploaded — otherwise the app's updater can't match them.
          $files |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name -replace ' ', '.')" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

      - name: Upload Android APK + AAB to the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          gh release upload "${{ github.ref_name }}" "android-release/IA-Usage-Android-$version.apk" "android-release/IA-Usage-Android-$version.aab" --clobber

      - name: Upload VSIX to the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          gh release upload "${{ github.ref_name }}" "vscode-release/IA-Usage-VSCode-$version.vsix" --clobber
