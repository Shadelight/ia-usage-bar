name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installers
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: IA Usage Bar ${{ github.ref_name }}
          releaseBody: |
            Download the NSIS setup executable or the MSI installer below.
            Verify SHA256SUMS.txt against the file you downloaded before running it.
          releaseDraft: true
          prerelease: false

      - name: Checksum installers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.exe,*.msi |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
